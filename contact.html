<title>Contact — Pause</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{--navy:#092663;--blue:#1873EA;--amber:#FBBC48;--cream:#F7F4EE}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);color:var(--navy);font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  nav{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 42px;color:#fff;
    background:rgba(13,60,168,.72);
    backdrop-filter:saturate(150%) blur(16px);
    -webkit-backdrop-filter:saturate(150%) blur(16px);
    border-bottom:1px solid rgba(255,255,255,.14);
  }
  .wordmark{font-family:'Young Serif',serif;font-size:24px;color:#fff;text-decoration:none}
  .navlinks{display:flex;gap:34px;font-weight:300;font-size:14.5px}
  .navlinks a{color:rgba(255,255,255,.85);text-decoration:none}
  .navlinks a:hover{color:#fff}
  .navcta{
    font-weight:500;font-size:14px;padding:10px 20px;border-radius:22px;
    border:1px solid rgba(255,255,255,.6);color:#fff;text-decoration:none;
  }
  @media (max-width:820px){ .navlinks{display:none} nav{padding:14px 20px} }

  .hero{
    padding:150px 24px 90px;text-align:center;
    background:linear-gradient(180deg,#0B3DAE 0%,#1873EA 55%,#3E8CF0 100%);
    color:#fff;
  }
  .eyebrow{
    font-size:12px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;
    color:var(--amber);margin-bottom:18px;
  }
  h1{font-family:'Young Serif',serif;font-weight:400;font-size:clamp(38px,6vw,64px);margin-bottom:16px;line-height:1.05}
  .hero p{font-weight:300;font-size:18px;line-height:1.55;max-width:560px;margin:0 auto;color:rgba(255,255,255,.85)}

  main{max-width:720px;margin:0 auto;padding:64px 24px 40px}

  .reasons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:48px}
  .reason-chip{
    font-size:13.5px;font-weight:500;color:var(--navy);
    background:rgba(24,115,234,.08);border:1px solid rgba(24,115,234,.18);
    padding:8px 16px;border-radius:999px;
  }

  .form-embed{
    border-radius:20px;overflow:hidden;
    background:#fff;
    box-shadow:0 12px 34px rgba(9,38,99,.08);
    display:flex;justify-content:center;
  }
  .form-embed iframe{
    width:100%;max-width:640px;height:691px;
    border:none;display:block;
  }

  .email-fallback{text-align:center;margin-top:22px;font-size:14px;font-weight:300;color:rgba(9,38,99,.6)}
  .email-fallback a{color:var(--blue);font-weight:500;text-decoration:none}

  footer{padding:48px 24px 56px}
  .footer-inner{
    max-width:1180px;margin:0 auto;padding-top:32px;
    border-top:1px solid rgba(9,38,99,.12);
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
  }
  .footer-mark{font-family:'Young Serif',serif;font-size:19px}
  .footer-links{display:flex;gap:24px;flex-wrap:wrap}
  .footer-links a{color:rgba(9,38,99,.68);text-decoration:none;font-weight:400;font-size:13.5px}
  .footer-links a:hover{color:var(--navy)}
  .footer-copy{color:rgba(9,38,99,.48);font-weight:300;font-size:12.5px}
</style>
</head>
<body>

<nav>
  <a href="/" class="wordmark">Pause</a>
  <div class="navlinks">
    <a href="/#how-it-works">How it works</a>
    <a href="/#puzzles">Puzzles</a>
    <a href="roadmap.html">Roadmap</a>
    <a href="blog/">Blog</a>
    <a href="contact.html">Contact</a>
  </div>
  <a href="https://apps.apple.com/us/app/pause-mindful-scrolling/id6781665628" class="navcta">Download</a>
</nav>

<section class="hero">
  <div class="eyebrow">Contact</div>
  <h1>Get in touch.</h1>
  <p>Press, partnerships, feedback, or just want to say hi — this goes straight to us.</p>
</section>

<main>
  <div class="reasons">
    <span class="reason-chip">Press &amp; media</span>
    <span class="reason-chip">Partnerships</span>
    <span class="reason-chip">Feedback</span>
    <span class="reason-chip">Something else</span>
  </div>

  <div class="form-embed">
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSf5LnVperTjdmjqNhAAQSdM580TCB5fWtUuZcGuzjEDptcvPg/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-mark">Pause</div>
    <div class="footer-links">
      <a href="roadmap.html">Roadmap</a>
      <a href="blog/">Blog</a>
      <a href="contact.html">Contact</a>
      <a href="privacy/">Privacy</a>
    </div>
    <div class="footer-copy">© 2026 Pause. Made for scrolling on purpose.</div>
  </div>
</footer>

</body>
</html>
